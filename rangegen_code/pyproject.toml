[project]
name = "RangeGen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Timo Μäenpää", email = "timo.maenpaa@oulu.fi" }
]
requires-python = ">=3.12"
dependencies = [
    "laspy[laszip,lazrs]>=2.7.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "pycocotools>=2.0.11",
    "pypcd4>=1.4.3",
    "pyproj>=3.7.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "toml>=0.10.2",
    "tqdm>=4.67.3",
]

[project.scripts]
rangeimagegenerator = "rangeimagegenerator:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
